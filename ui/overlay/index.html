<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>voice-overlay</title>
<link rel="stylesheet" href="overlay.css" />
</head>
<body>
<!-- 錄音膠囊：上方是音量警告泡（平時隱藏），下方是膠囊本體。
     錄音中：麥克風圖示＋24 根波形條＋秒數；處理中：不確定進度條＋「處理中…」。
     畫面全由 overlay.js 隨 meter／overlay-show／overlay-processing 事件驅動，邏輯見 lib/bars.js。 -->
<div id="root">
  <div id="warning" data-tone="low" hidden>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14H1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" /><path d="M8 6v4M8 11.7v.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
    <span id="warning-text"></span>
  </div>
  <div id="pill">
    <!-- 標準填滿式麥克風圖示（Bootstrap Icons mic-fill 造型），顏色跟隨模式主色。 -->
    <svg id="mic" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z" />
      <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5" />
    </svg>
    <div id="rec">
      <div id="bars"></div>
      <span id="timer">0:00</span>
    </div>
    <div id="busy">
      <div class="track"><div class="slider"></div></div>
      <span>處理中…</span>
    </div>
  </div>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
